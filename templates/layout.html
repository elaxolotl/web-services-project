<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gavel</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <!-- Prism.js for code highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <!-- Font Awesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

</head>

<body>

    <!--navbar-->
    <nav>
        <a class="navbar-brand" href="/">
            <img src="/static/images/logo-side-text.png" alt="gavel logo" width="100">
        </a>
        <ul class="navbar-nav">
            <li>
                <a aria-current="page" href="/">Home</a>
            </li>
            <li>
                <a aria-current="page" href="/docs">Documentation</a>
            </li>
            <li>
                <a aria-current="page" href="/features">Features</a>
            </li>
            <li>
                <a aria-current="page" href="" class="secondary-btn">Login</a>
            </li>
            <li>
                <a aria-current="page" href="" class="primary-btn">Register</a>
            </li>
        </ul>
    </nav>

    {% block content %}
    {% endblock %}

    <!--footer-->
    <footer>
        <div class="first-part">
            <img src="../static/images/logo.png" alt="gavel logo">
            <p>Stay ahead of the curve!</p>
        </div>
        <hr/>
        <div class="quick-links">
            <h5>Quick Links</h5><br/>
            <ul>
                <li><a href="/" >Home</a></li>
                <li><a href="/docs">Documentation</a></li>
                <li><a href="/features">Features</a></li>
            </ul>
        </div>
    </footer>

</body>

</html>
